name: CI

# Unit tests on JDK 17, 21 and 25, and the integration tests against a real Chargewire server
# (hardcharger-server), on every push to main and every pull request, and as the release gate
# (release.yml calls this workflow on the tagged commit). The integration tests fail, never skip,
# without a server.
#
# hardcharger-server comes from the private image ghcr.io/gizmodata/hardcharger, pulled with this
# workflow's GITHUB_TOKEN: the package grants this repository read access (package settings,
# Manage Actions access). No personal token is involved.

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

# The group names the caller's workflow (a called workflow sees the caller's github.workflow),
# so a release dispatch that calls this workflow never cancels a push run of it; "-tests" keeps
# it apart from release.yml's own group, which would otherwise deadlock with it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-tests
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The server the integration tests run against: Hardcharger's main branch, which its CI
  # publishes on every green push (:main, and :sha-<short> for a fixed build). Pin a :sha- tag
  # here to reproduce an old run.
  HARDCHARGER_IMAGE: ghcr.io/gizmodata/hardcharger:main

jobs:
  build:
    name: Unit tests (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [17, 21, 25]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - name: Build and run the unit tests
        run: mvn -B -ntp package
      - name: Check formatting and Javadoc
        if: matrix.jdk == 17
        run: mvn -B -ntp spotless:check javadoc:javadoc -Ddoclint=all
      - name: Check the jar is self-contained
        if: matrix.jdk == 17
        run: |
          set -euo pipefail
          jar tf target/chargewire-jdbc.jar > entries.txt
          grep -q '^META-INF/services/java.sql.Driver$' entries.txt
          # Every dependency is relocated except zstd-jni, whose JNI symbols name its package.
          if grep -E '^(org|com/fasterxml|com/google)/' entries.txt; then
            echo "::error::unrelocated classes in the standalone jar"
            exit 1
          fi
          # The jar Maven deploys is the standalone jar, so its POM must list no dependencies.
          python3 -I - target/dependency-reduced-pom.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          root = ET.parse(sys.argv[1]).getroot()
          runtime = [
              d.findtext("m:artifactId", "", ns)
              for d in root.findall("m:dependencies/m:dependency", ns)
              if d.findtext("m:scope", "compile", ns) not in ("test", "provided")
          ]
          if runtime:
              print(f"::error::the deployed POM lists runtime dependencies: {runtime}")
              sys.exit(1)
          print("the deployed POM lists no runtime dependencies")
          PY
      - uses: actions/upload-artifact@v7
        if: matrix.jdk == 17
        with:
          name: chargewire-jdbc
          path: target/chargewire-jdbc.jar

  integration:
    name: Integration tests (JDK ${{ matrix.jdk }}, Hardcharger)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        jdk: [17, 25]
    env:
      # How hardcharger-server differs from chargewire-duckdb, the suite's default (README "Testing").
      CHARGEWIRE_JDBC_TEST_SERVER_PASSWORD_ENV: HARDCHARGER_ADMIN_PASSWORD
      CHARGEWIRE_JDBC_TEST_SERVER_MTLS_FLAG: --mtls-ca-cert
      CHARGEWIRE_JDBC_TEST_SERVER_USERNAME_FLAG: --admin-username
      CHARGEWIRE_JDBC_TEST_SERVER_NAME: Hardcharger
      # Browser sign-in (BrowserSignInIT): Hardcharger's provider flags, a template the suite fills.
      CHARGEWIRE_JDBC_TEST_SERVER_OAUTH_ARGS: >-
        --token-allowed-issuer {issuer} --token-allowed-audience {client_id}
        --token-default-role admin --token-authorized-emails {identity}
        --oauth-client-id {client_id} --oauth-base-url {base_url} --oauth-provider-name Mock
      CHARGEWIRE_JDBC_TEST_SERVER_OAUTH_SECRET_ENV: HARDCHARGER_OAUTH_CLIENT_SECRET
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - uses: ./.github/actions/hardcharger-server
        with:
          image: ${{ env.HARDCHARGER_IMAGE }}
          token: ${{ github.token }}
      # failsafe's failIfNoTests and the suite's fail-without-a-server make a green job mean the
      # integration tests really ran.
      - name: Unit and integration tests
        run: mvn -B -ntp verify
